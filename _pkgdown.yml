url: https://s7-stats.github.io/statim

template:
  bootstrap: 5
  light-switch: true
  bootswatch: flatly
  bslib:
    base_font: {google: "Source Serif 4"}
    heading_font: {google: "Fraunces"}
    code_font: {google: "Fira Mono"}
    primary: "#0A2947"
    link-color: "#AA1C41"
  math-rendering: katex

home:
  title: "statim • A Declarative Interface for Statistical Inference"
  description: >
    A declarative interface and a re-imagination of "grammar of statistical inference" framework in a package, mixing with 'ggplot2' / 'tidyverse' paradigm.

navbar:
  type: light
  structure:
    left: [intro, reference, articles, news, examples]
    right: [search, github, lightswitch, blog]
  components:
    intro:
      text: Get started
      href: articles/statim.html
    reference:
      text: Reference
      href: reference/index.html
    examples:
      text: Examples
      menu:
      - text: "Hypothesis Testing"
        href: articles/usage/htest.html
      - text: "Regression Modelling"
        href: articles/usage/model-infer.html
      - text: "Beyond Equality: Custom Hypotheses with {statim}"
        href: articles/usage/beyond-null.html
      - text: "Effect Size"
        href: articles/usage/effect-size.html
      - text: "Prediction from Regression Models"
        href: articles/usage/predict-examples.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/s7-stats/statim
      aria-label: GitHub

reference:
  - title: High Level API
    desc: Main functions for interactive use

  - subtitle: Statistical Inference Layout definer and data preparation
    desc: Verbs that describe the model you want to analyze
    contents:
    - layout-define-base
    - write_models

  - subtitle: Variable Mapper IDs
    desc: Mappers similar to formula in R to shape the model you want to describe. Formula also allowed.
    contents:
    - x_by
    - rel
    - pairwise
    - prop
    - 'on'

  - subtitle: Statistical Inference Parameterization
    desc: Verbs used for preparing and parameterize the equation of statistical inference
    contents:
    - define_model
    - prepare
    - prepare_test
    - prepare_model
    - null-hyp
    - via
    - conclude

  - subtitle: \"Population parameter\" definer
    desc: Functions that emulate the population parameter, close to textbook notations
    contents:
    # - equal-op
    - MU
    - PI
    # - SIGMA
    - RHO

  - subtitle: ANOVA for Linear Models
    desc: Verbs used to perform ANOVA for linear models
    contents:
    - anova-mod
    - write_models
    - prepare_model

  - subtitle: Output retriever and displayer
    desc: Verbs used to retrieve outputs in standard R's data structure
    contents:
    - tidy
    - display

  - subtitle: H-test container and executioner
    desc: Container and an eager executioner of a prepared H-test function
    contents:
    - T_TEST
    - COR_TEST
    # - ANOVA
    - P_TEST

  - subtitle: Model-based inference container and executioner
    desc: Container and an eager executioner of a prepared model-based inference function
    contents:
    - LINEAR_REG
    - GLM

  - subtitle: Post-hoc functions
    desc: Functions used after execution
    contents:
    - predict
    - gauge
    - tidy

  - subtitle: Multiple Inline Codes
    desc: Analogue to `I()`, but only captures the expression and accepts multiple inline codes.
    contents:
    - inlines

  # - subtitle: Output renderer and saver
  #   desc: Capture the printed output in specific formats
  #   contents:
  #   - save_excel

  # - title: Low Level API
  #   desc: Functions to interact with the statim internals

  - title: Low-level / Developer facing API
    desc: Functions for building and extending test implementations

  - subtitle: Model ID helpers
    desc: Classes and internal functions
    contents:
    - var_id
    - model-processor
    - var_id_info
    - class_var_inform

  - subtitle: Implementation containers
    desc: Declare how a test runs
    contents:
    - agendas
    - baseline
    - variant

  - subtitle: Base statistical inference output class
    desc: With different implementation but the same class, the methods, e.g. `tidy()`, will be shareable
    contents:
    - class_stat_infer
    - class_ttest_one
    - class_ttest_two
    - class_ttest_pairwise
    - class_p_test
    - class_corr_two
    - class_lm_object
    - class_glm_object

  - subtitle: Test definition
    desc: Register a new test implementation
    contents:
    - stat_define
    - STAT_CONSTRUCTOR
    - HTEST_FN
    - MODEL_FN

  - subtitle: stat_define add-ons management
    desc: Add or remove estimation method on existing test functions
    contents:
    - add-stat-define
    - purge_stat_defines

  - subtitle: Session-scoped variant management
    desc: Add or replace variants on existing test functions
    contents:
    - add-variant
    - modifying-assignment

  - subtitle: Modelled hypothesis \"population parameter\" definer
    desc: Core class of \"population parameter\" definer
    contents:
    - param_obj

  - subtitle: Modelled hypothesis management and validators
    desc: Core helpers to parse the modelled hypotheses, objects from `state_null()`
    contents:
    - claim-vars-validators
    - claim_scalar
    - claim_contrast_coefs

  - subtitle: Modelled hypothesis translator and container
    desc: Core function to contain the implementation to translate modelled hypothesis, placed under `claim_parser` from `baseline()` / `variant()`
    contents:
    - map_claim
    - baseline
    - variant

  - subtitle: Tidy implementation container
    desc: Add or replace `tidy()` method for following `STAT_CONSTRUCTOR` objects
    contents:
    - auto_tidy
    - making_tidy
    - method_tidy
    - modifying-assignment

  - subtitle: Prediction implementer
    desc: Add or modify `predict()` method for following `STAT_CONSTRUCTOR` objects
    contents:
    - auto_predict
    - making_predict
    - method_predict
    - modifying-assignment

  - subtitle: Effect size implementer
    desc: Add or modify `gauge()` method for following `STAT_CONSTRUCTOR` objects
    contents:
    - auto_gauge
    - making_gauge
    - method_gauge
    - modifying-assignment

footer:
  structure:
    left: developed_by
    right: built_with
  components:
    built_with: >
      Built with <a href="https://pkgdown.r-lib.org/">pkgdown</a>.
#     Visit my <a href="https://s7-stats.com">blog</a> for more content.

articles:

  - title: A guide on using statim R package
    navbar: A guide on using statim R package
    contents:
    - usage/htest
    - usage/model-infer
    - usage/beyond-null
    - usage/anova-mod
    - usage/predict-examples
    - usage/effect-size
    # - usage/multiple-exec

  - title: Pointers of statim you need to know
    navbar: Pointers of statim you need to know
    contents:
    - pointers/var_id
    - pointers/stat_define
    - pointers/hypothesis-expressions
    - pointers/recalibration-method
    - pointers/execution-methods

  - title: Writing statim extensions
    navbar: Writing statim extensions
    contents:
    - extend/new-est-method
    - extend/new-tidy

development:
  mode: auto
  version_label: default
  version_tooltip: "Version"
